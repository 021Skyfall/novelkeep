<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="노벨킵 공개 작품 목록">
    <title>작품 둘러보기 | 노벨킵</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/novel.css}">
</head>
<body>
<nav class="navbar bg-white border-bottom sticky-top" aria-label="작품 목록 메뉴">
    <div class="container py-2">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/main}">
            <span class="brand-mark" aria-hidden="true">N</span>
            <span>노벨킵</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/main}">메인</a>
            <button class="btn btn-sm btn-outline-secondary theme-toggle" type="button"
                    data-theme-toggle aria-label="다크 모드로 전환" aria-pressed="false">
                <span aria-hidden="true">◐</span>
                <span data-theme-label>다크 모드</span>
            </button>
            <span class="badge role-badge rounded-pill" th:text="|${roleName} 체험 중|">체험 중</span>
        </div>
    </div>
</nav>

<main class="container py-5">
    <header class="page-heading mb-4">
        <span class="eyebrow">PUBLIC NOVELS</span>
        <h1 class="display-6 fw-bold mt-2">작품 둘러보기</h1>
        <p class="text-secondary mb-0">모든 체험 역할이 같은 공개 작품을 확인합니다.</p>
    </header>

    <div th:if="${#lists.isEmpty(novels)}" class="empty-state">
        <strong>아직 공개된 작품이 없습니다.</strong>
        <p class="mb-0">작가가 작품을 공개하면 이곳에서 확인할 수 있습니다.</p>
    </div>

    <div th:unless="${#lists.isEmpty(novels)}" class="row g-4">
        <div th:each="novel, iter : ${novels}" class="col-md-6 col-xl-4">
            <article class="novel-card h-100">
                <div class="novel-cover"
                     th:classappend="${iter.index % 3 == 0 ? 'cover-one' : (iter.index % 3 == 1 ? 'cover-two' : 'cover-three')}">
                    <span th:text="${#numbers.formatInteger(iter.count, 2)}">01</span>
                </div>
                <div class="novel-card-body">
                    <div class="d-flex flex-wrap gap-2 mb-2">
                        <span class="badge status-badge" th:text="${novel.status.displayName}">연재 중</span>
                        <span th:if="${novel.partMode.name() == 'MULTI'
                                      and !#lists.isEmpty(novel.parts)
                                      and novel.parts[0].status.name() == 'COMPLETED'}"
                              class="badge part-badge"
                              th:text="|${novel.parts[0].partNumber}부 완결|">1부 완결</span>
                        <span class="badge text-bg-light border" th:text="${novel.genre}">장르</span>
                    </div>
                    <h2 class="h5 fw-bold" th:text="${novel.title}">작품명</h2>
                    <p class="text-secondary synopsis" th:text="${novel.synopsis}">작품 소개</p>
                    <div class="d-flex justify-content-between align-items-center gap-2">
                        <span class="small text-secondary" th:text="|필명 ${novel.penName}|">필명</span>
                        <a class="btn btn-sm btn-outline-dark"
                           th:href="@{/novels/{id}(id=${novel.id})}">상세 보기</a>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>

<footer class="border-top py-4">
    <div class="container small text-secondary">NovelKeep · 모든 역할이 같은 공개 작품을 봅니다.</div>
</footer>
</body>
</html>
