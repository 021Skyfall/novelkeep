<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="노벨킵 작품 탐색">
    <title th:text="${criteria.favoriteOnly} ? '내 즐겨찾기 | 노벨킵' : '작품 탐색 | 노벨킵'">작품 탐색 | 노벨킵</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/novel.css}">
    <link rel="stylesheet" th:href="@{/css/novel-genre.css}">
</head>
<body th:classappend="${roleKey != null} ? | role-${#strings.toLowerCase(roleKey)}|">
<div th:replace="~{fragments/navigation :: siteNav(${navActive})}"></div>

<main class="container py-5">
    <header class="page-heading mb-4">
        <span class="eyebrow">NOVEL BROWSE</span>
        <h1 class="display-6 fw-bold mt-2"
            th:text="${criteria.favoriteOnly} ? '내 즐겨찾기' : '작품 탐색'">작품 탐색</h1>
        <p class="text-secondary mb-0"
           th:text="${criteria.favoriteOnly}
               ? '내가 즐겨찾은 공개 작품을 모아서 봅니다.'
               : '공개 작품을 검색하고 추천·장르·연재 상태로 찾아봅니다.'">안내</p>
    </header>

    <div th:fragment="asyncContent" data-async-content data-async-base="/novels" aria-live="polite">

        <form class="search-panel mb-4" method="get" th:action="@{/novels}" th:object="${criteria}"
              data-auto-search-form data-async-search
              data-default-sort-field="latest"
              data-default-sort-dir="DESC"
              th:attr="data-active-sort-field=${criteria.sort}, data-active-sort-dir=${criteria.sortDir}">
            <input th:if="${criteria.favoriteOnly}" type="hidden" name="favorite" value="true">
            <div class="row g-3 align-items-end">
                <div class="col-lg-4">
                    <label class="form-label fw-semibold" for="keyword">검색어</label>
                    <div class="keyword-search-field">
                        <input id="keyword" class="form-control" type="search" name="keyword"
                               th:value="*{keyword}" placeholder="제목, 필명, 소개"
                               data-keyword-search-input autocomplete="off">
                        <button class="keyword-search-btn" type="submit" data-keyword-search-btn
                                aria-label="검색">
                            <span aria-hidden="true">⌕</span>
                        </button>
                    </div>
                </div>
                <div class="col-md-6 col-lg-2">
                    <label class="form-label fw-semibold" for="progress">연재 상태</label>
                    <select id="progress" class="form-select" name="progress" data-auto-search>
                        <option value="" th:selected="${criteria.progress == null or criteria.progress == ''}">전체</option>
                        <option value="SERIALIZING" th:selected="${criteria.serializingProgress}">연재 중</option>
                        <option value="PART_COMPLETED" th:selected="${criteria.partCompletedProgress}">부 완결</option>
                        <option value="COMPLETED" th:selected="${criteria.completedProgress}">전체 완결</option>
                    </select>
                </div>
                <div class="col-md-6 col-lg-3">
                    <span class="form-label fw-semibold d-block">펀딩 중</span>
                    <div class="publishing-chip-row" role="group" aria-label="펀딩 중 여부">
                        <button type="button" class="btn btn-sm publishing-chip"
                                data-funding-open=""
                                th:classappend="${criteria.fundingOpen == null} ? ' is-active'">전체</button>
                        <button type="button" class="btn btn-sm publishing-chip"
                                data-funding-open="true"
                                th:classappend="${criteria.fundingOpen == true} ? ' is-active'">Y</button>
                        <button type="button" class="btn btn-sm publishing-chip"
                                data-funding-open="false"
                                th:classappend="${criteria.fundingOpen == false} ? ' is-active'">N</button>
                    </div>
                    <input type="hidden"
                           th:attr="name=${criteria.fundingOpen != null} ? 'fundingOpen' : null"
                           th:value="${criteria.fundingOpen}"
                           data-funding-open-input>
                </div>
                <div class="col-md-6 col-lg-2" th:if="${isAdmin}">
                    <label class="form-label fw-semibold" for="visibility">공개 여부</label>
                    <select id="visibility" class="form-select" name="visibility" data-auto-search>
                        <option value="">전체</option>
                        <option th:each="visibilityOption : ${visibilities}"
                                th:value="${visibilityOption}"
                                th:text="${visibilityOption.displayName}"
                                th:selected="${criteria.visibility == visibilityOption}">공개</option>
                    </select>
                </div>
            </div>

            <div class="genre-filter mt-3" data-genre-filter>
                <div class="genre-filter-label">장르 <span class="fw-normal text-secondary">(모두 포함 · AND)</span></div>
                <div data-genre-hidden>
                    <input th:each="selectedGenre : ${criteria.genres}" type="hidden"
                           name="genres" th:value="${selectedGenre}">
                </div>
                <div class="genre-badge-list">
                    <button th:each="genreOption : ${allGenres}"
                            type="button"
                            class="genre-badge"
                            th:classappend="${#lists.contains(criteria.genres, genreOption)} ? ' is-active'"
                            th:attr="data-genre-value=${genreOption}"
                            data-genre-badge
                            th:text="${genreOption.displayName}">장르</button>
                </div>
            </div>

            <div class="mt-3">
                <span class="form-label fw-semibold d-block mb-2">정렬</span>
                <div class="publishing-chip-row" role="group" aria-label="정렬">
                    <button type="button" class="btn btn-sm publishing-chip"
                            data-sort-field="latest" data-sort-label="수정일">수정일</button>
                    <button type="button" class="btn btn-sm publishing-chip"
                            data-sort-field="recommend" data-sort-label="추천">추천</button>
                    <button type="button" class="btn btn-sm publishing-chip"
                            data-sort-field="title" data-sort-label="제목">제목</button>
                </div>
            </div>
            <div class="d-flex justify-content-end mt-3">
                <a class="btn btn-outline-dark" data-async-reset
                   th:href="${criteria.favoriteOnly} ? @{/novels(favorite=true)} : @{/novels}">초기화</a>
            </div>
            <input type="hidden" name="sort" th:value="${criteria.sort}">
            <input type="hidden" name="sortDir" th:value="${criteria.sortDir}">
        </form>

        <div th:if="${novels.totalElements == 0}" class="empty-state">
            <strong th:text="${criteria.favoriteOnly} ? '즐겨찾은 작품이 없습니다.' : '검색 결과가 없습니다.'">검색 결과가 없습니다.</strong>
            <p class="mb-0">조건을 바꾸거나 초기화한 뒤 다시 찾아 보세요.</p>
        </div>

        <div th:unless="${novels.totalElements == 0}">
            <p class="small text-secondary mb-3"
               th:text="|총 ${novels.totalElements}건 · ${novels.number + 1}/${novels.totalPages}페이지|">결과</p>
            <div class="row g-4 position-relative" data-novel-list
                 th:attr="data-favorite-view=${criteria.favoriteOnly}, data-recommend-sort=${criteria.recommendSort}">
                <div class="position-absolute top-50 start-50 translate-middle z-3 w-auto
                            fs-4 fw-bold text-secondary d-none"
                     data-async-status aria-label="목록 불러오는 중">...</div>
                <div th:each="novel, iter : ${novels.content}" class="col-md-6 col-xl-4" data-novel-card
                     th:attr="data-novel-id=${novel.id}">
                    <article class="novel-card h-100" data-novel-href
                             th:attr="data-novel-href=@{/novels/{id}(id=${novel.id})}">
                        <div class="novel-cover"
                             th:classappend="${iter.index % 3 == 0 ? 'cover-one' : (iter.index % 3 == 1 ? 'cover-two' : 'cover-three')}">
                            <div class="novel-cover-overlays"
                                 th:with="campaigns=${openFundingByNovelId != null ? openFundingByNovelId.get(novel.id) : null},
                                          recommendLabel=${novel.recommendationCount > 9999 ? '추천 9999+' : '추천 ' + novel.recommendationCount}">
                                <div class="cover-badge-row">
                                    <span class="badge status-badge" th:text="${novel.status.displayName}">연재 중</span>
                                    <span th:if="${novel.multiPart and novel.latestCompletedPartLabel() != null}"
                                          class="badge part-badge"
                                          th:text="${novel.latestCompletedPartLabel()}">1부 완결</span>
                                </div>
                                <form th:if="${novel.visibility.name() == 'PUBLIC'}"
                                      class="cover-favorite"
                                      th:action="@{/novels/{id}/favorite(id=${novel.id})}" method="post"
                                      data-novel-action="favorite"
                                      th:attr="data-novel-id=${novel.id}">
                                    <input type="hidden" name="returnTo"
                                           th:value="${criteria.favoriteOnly} ? 'favorites' : 'browse'">
                                    <button class="btn btn-sm favorite-toggle" data-action-button
                                            th:classappend="${#sets.contains(favoritedIds, novel.id)} ? ' is-active'"
                                            type="submit"
                                            th:aria-label="${#sets.contains(favoritedIds, novel.id) ? '내 즐겨찾기 해제' : '내 즐겨찾기'}"
                                            th:text="${#sets.contains(favoritedIds, novel.id) ? '★' : '☆'}">☆</button>
                                </form>
                                <div class="cover-bottom-row">
                                    <div th:if="${campaigns != null and #lists.size(campaigns) == 1}"
                                         class="cover-funding">
                                        <div th:replace="~{fragments/funding-badge :: openFundingBadgeLabeled(
                                            ${campaigns[0]},
                                            ${novel.multiPart ? campaigns[0].storyPart.partNumber + '부 펀딩 중' : '펀딩 중'}
                                        )}"></div>
                                    </div>
                                    <div th:if="${campaigns != null and #lists.size(campaigns) > 1}"
                                         class="cover-funding"
                                         th:with="avgPct=${T(com.novelkeep.funding.domain.FundingCampaign).averageAchievementPercent(campaigns)}">
                                        <div th:replace="~{fragments/funding-badge :: fundingMeterLabeled('다수 펀딩 중', ${avgPct})}"></div>
                                    </div>
                                    <form th:if="${novel.visibility.name() == 'PUBLIC' and novel.author.id != currentMemberId}"
                                          class="cover-recommend"
                                          th:action="@{/novels/{id}/recommend(id=${novel.id})}" method="post"
                                          data-novel-action="recommend"
                                          th:attr="data-novel-id=${novel.id}">
                                        <input type="hidden" name="returnTo"
                                               th:value="${criteria.favoriteOnly} ? 'favorites' : 'browse'">
                                        <button class="btn btn-sm recommend-toggle" data-action-button
                                                th:classappend="${#sets.contains(recommendedIds, novel.id)} ? ' is-active'"
                                                type="submit"
                                                th:attr="aria-pressed=${#sets.contains(recommendedIds, novel.id)}"
                                                th:aria-label="${#sets.contains(recommendedIds, novel.id) ? '추천 취소' : '추천하기'}">
                                            <span data-recommend-count
                                                  th:text="${recommendLabel}">추천 0</span>
                                            <svg class="recommend-thumb-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                                <path fill="currentColor"
                                                      d="M2 10.5h3.2V21H2zm19.1 1.1c0-.7-.6-1.3-1.3-1.3h-5.1l.8-3.6.1-.6c0-.3-.1-.6-.3-.8l-.8-.8L9.8 9.2c-.3.3-.5.7-.5 1.1V19c0 .8.7 1.5 1.5 1.5h6.7c.5 0 1-.3 1.2-.8l2.3-5.4c.1-.2.1-.4.1-.6v-.1z"/>
                                            </svg>
                                        </button>
                                    </form>
                                    <span th:if="${novel.visibility.name() != 'PUBLIC' or novel.author.id == currentMemberId}"
                                          class="badge recommend-badge cover-recommend" data-recommend-count
                                          th:text="${recommendLabel}">추천 0</span>
                                </div>
                            </div>
                        </div>
                        <div class="novel-card-body">
                            <div th:if="${isAdmin}" class="compact-tag-meta mb-1">
                                <span class="badge"
                                      th:classappend="${novel.visibility.name() == 'PUBLIC'} ? ' visibility-public' : ' visibility-private'"
                                      th:text="${novel.visibility.displayName}">공개</span>
                            </div>
                            <div th:if="${!#lists.isEmpty(novel.genres)}"
                                 class="novel-tag-row genre-tag-row"
                                 data-tag-row data-tag-mode="inline">
                                <div class="novel-tag-list genre-tag-list" data-tag-list>
                                    <span th:each="genreItem : ${novel.genres}"
                                          class="badge text-bg-light border"
                                          data-clamp-tag
                                          th:text="${genreItem.displayName}">장르</span>
                                    <button class="badge text-bg-light border novel-tag-more d-none" type="button"
                                            data-tag-more aria-label="태그 더 보기">...</button>
                                </div>
                            </div>
                            <h2 class="h5 fw-bold novel-card-title title-clamp-2" th:text="${novel.title}"
                                th:title="${novel.title}">작품명</h2>
                            <p class="text-secondary synopsis" th:text="${novel.synopsis}">작품 소개</p>
                            <div class="novel-card-bottom mt-auto">
                                <div class="novel-card-footer pt-0">
                                    <span class="small text-secondary" th:text="|필명 ${novel.penName}|">필명</span>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
            </div>

            <nav th:if="${novels.totalPages > 1}" class="mt-4" aria-label="작품 목록 페이지" data-async-pagination>
                <ul class="pagination justify-content-center flex-wrap">
                    <li class="page-item" th:classappend="${novels.first} ? ' disabled'">
                        <a class="page-link" data-async-page
                           th:href="@{/novels(keyword=${criteria.keyword}, genres=${criteria.genres}, progress=${criteria.progress}, visibility=${criteria.visibility}, fundingOpen=${criteria.fundingOpen}, favorite=${criteria.favorite}, sort=${criteria.sort}, sortDir=${criteria.sortDir}, page=${novels.number - 1})}">이전</a>
                    </li>
                    <li class="page-item"
                        th:each="pageNumber : ${#numbers.sequence(0, novels.totalPages - 1)}"
                        th:classappend="${pageNumber == novels.number} ? ' active'">
                        <a class="page-link" data-async-page
                           th:text="${pageNumber + 1}"
                           th:href="@{/novels(keyword=${criteria.keyword}, genres=${criteria.genres}, progress=${criteria.progress}, visibility=${criteria.visibility}, fundingOpen=${criteria.fundingOpen}, favorite=${criteria.favorite}, sort=${criteria.sort}, sortDir=${criteria.sortDir}, page=${pageNumber})}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${novels.last} ? ' disabled'">
                        <a class="page-link" data-async-page
                           th:href="@{/novels(keyword=${criteria.keyword}, genres=${criteria.genres}, progress=${criteria.progress}, visibility=${criteria.visibility}, fundingOpen=${criteria.fundingOpen}, favorite=${criteria.favorite}, sort=${criteria.sort}, sortDir=${criteria.sortDir}, page=${novels.number + 1})}">다음</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<footer class="border-top py-4">
    <div class="container small text-secondary">NovelKeep · 공개 작품을 탐색합니다.</div>
</footer>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sort-cycle.js}"></script>
<script th:src="@{/js/novel-card.js}"></script>
<script th:src="@{/js/novel-search.js}"></script>
<script th:src="@{/js/novel-actions.js}"></script>
<script th:src="@{/js/novel-genre-filter.js}"></script>
</body>
</html>
