<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="노벨킵 작품 상세">
    <title th:text="${novel.title + ' | 노벨킵'}">작품 상세 | 노벨킵</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/novel.css}">
</head>
<body th:classappend="${roleKey != null} ? | role-${#strings.toLowerCase(roleKey)}|">
<div th:replace="~{fragments/navigation :: siteNav(${fromWriter} ? 'writer' : 'novels')}"></div>

<main class="container py-5">
    <div class="mb-4">
        <button class="btn btn-back-list" type="button" data-back-to-list
                th:attr="data-fallback-url=${fromWriter} ? @{/writer/novels} : @{/novels}">← 목록으로</button>
    </div>

    <div th:if="${param.created}" class="alert alert-success">작품을 등록했습니다.</div>
    <div th:if="${param.updated}" class="alert alert-success">작품 정보를 수정했습니다.</div>

    <section class="detail-panel">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-4">
            <div>
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <span class="badge status-badge" th:text="${novel.status.displayName}">연재 중</span>
                    <span class="badge"
                          th:classappend="${novel.visibility.name() == 'PUBLIC'} ? ' visibility-public' : ' visibility-private'"
                          th:text="${novel.visibility.displayName}">공개</span>
                    <span th:if="${novel.partMode.name() == 'MULTI' and novel.latestCompletedPartLabel() != null}"
                          class="badge part-badge"
                          th:text="${novel.latestCompletedPartLabel()}">1부 완결</span>
                    <span class="badge text-bg-light border" th:text="${novel.genre}">장르</span>
                    <span class="badge text-bg-light border" th:text="${novel.partMode.displayName}">부 구분</span>
                    <span class="badge recommend-badge" data-recommend-count
                          th:text="|추천 ${novel.recommendationCount}|">추천 0</span>
                </div>
                <h1 class="display-6 fw-bold" th:text="${novel.title}">작품명</h1>
                <p class="text-secondary mb-0" th:text="|필명 ${novel.penName}|">필명</p>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-start" data-detail-actions>
                <div class="small text-danger w-100 d-none" data-action-error role="alert"></div>
                <form th:if="${canFavorite}"
                      th:action="@{/novels/{id}/favorite(id=${novel.id}, from=${fromWriter} ? 'writer' : null)}"
                      method="post"
                      data-novel-action="favorite"
                      th:attr="data-novel-id=${novel.id}">
                    <button class="btn favorite-toggle" data-action-button
                            th:classappend="${favorited} ? ' is-active'"
                            type="submit"
                            th:aria-label="${favorited} ? '내 즐겨찾기 해제' : '내 즐겨찾기'"
                            th:text="${favorited} ? '★' : '☆'">☆</button>
                </form>
                <form th:if="${canRecommend}"
                      th:action="@{/novels/{id}/recommend(id=${novel.id}, from=${fromWriter} ? 'writer' : null)}"
                      method="post"
                      data-novel-action="recommend"
                      th:attr="data-novel-id=${novel.id}">
                    <button class="btn" data-action-button
                            th:classappend="${recommended} ? 'btn-dark' : 'btn-outline-dark'"
                            type="submit"
                            th:text="${recommended} ? '추천 취소' : '추천하기'">추천하기</button>
                </form>
                <a th:if="${owned}" class="btn btn-outline-dark"
                   th:href="@{/writer/novels/{id}/edit(id=${novel.id})}">작품 수정</a>
                <form th:if="${owned}"
                      th:action="@{/writer/novels/{id}/delete(id=${novel.id})}" method="post"
                      data-confirm-delete="작품을 삭제할까요? 삭제 후에는 되돌릴 수 없습니다.">
                    <button class="btn btn-outline-danger" type="submit">작품 삭제</button>
                </form>
            </div>
        </div>
        <hr class="my-4">
        <p class="lead detail-synopsis mb-0" th:text="${novel.synopsis}">작품 소개</p>
    </section>

    <section class="mt-5" aria-labelledby="parts-title">
        <div class="section-heading">
            <div>
                <span class="eyebrow">STORY PARTS</span>
                <h2 id="parts-title" class="h3 fw-bold mt-2">부·회차 구성</h2>
            </div>
            <span class="small text-secondary">회차 기능은 다음 구현 단계에서 연결됩니다.</span>
        </div>

        <div class="part-list mt-3">
            <article th:each="part : ${novel.parts}" class="part-item">
                <div>
                    <span th:if="${novel.partMode.name() == 'MULTI'}"
                          class="badge part-badge mb-2"
                          th:text="${part.status.name() == 'COMPLETED'
                              ? part.partNumber + '부 완결'
                              : part.partNumber + '부 ' + part.status.displayName}">1부 연재 중</span>
                    <h3 class="h5 fw-bold mb-1"
                        th:text="${novel.partMode.name() == 'SINGLE' ? '회차 목록' : part.title}">부 제목</h3>
                    <p class="text-secondary mb-0">아직 등록된 회차가 없습니다.</p>
                </div>
                <span class="text-secondary small">0화</span>
            </article>
        </div>
    </section>
</main>

<footer class="border-top py-4">
    <div class="container small text-secondary">NovelKeep · 이야기를 끝까지, 소장까지</div>
</footer>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/novel-confirm.js}"></script>
<script th:src="@{/js/novel-actions.js}"></script>
<script>
    (function () {
        var button = document.querySelector('[data-back-to-list]');
        if (!button) {
            return;
        }
        button.addEventListener('click', function () {
            if (window.history.length > 1) {
                window.history.back();
                return;
            }
            window.location.href = button.getAttribute('data-fallback-url') || '/novels';
        });
    })();
</script>
</body>
</html>
