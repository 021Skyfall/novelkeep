<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="노벨킵 작품 상세">
    <title th:text="${novel.title + ' | 노벨킵'}">작품 상세 | 노벨킵</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/novel.css}">
</head>
<body th:classappend="${roleKey != null} ? | role-${#strings.toLowerCase(roleKey)}|">
<div th:replace="~{fragments/navigation :: siteNav(${fromWriter} ? 'writer' : 'novels')}"></div>

<main class="container py-5">
    <div class="mb-4">
        <a class="btn btn-back-list"
           th:href="${fromWriter} ? @{/writer/novels} : @{/novels}"
           th:text="${fromWriter} ? '← 내 작품' : '← 작품 목록'">← 목록</a>
    </div>

    <div th:if="${param.created}" class="alert alert-success"
         data-push-notification data-notification-type="success"
         data-notification-label="작품 등록">작품이 등록되었습니다. 기본 정보와 회차 구성을 확인해 주세요.</div>
    <div th:if="${param.updated}" class="alert alert-success"
         data-push-notification data-notification-type="success"
         data-notification-label="기본 정보 수정">작품 기본 정보가 저장되었습니다.</div>
    <div th:if="${param.episodeCreated}" class="alert alert-success"
         data-push-notification data-notification-type="success"
         data-notification-label="회차 등록">새 회차가 등록되었습니다.</div>
    <div th:if="${param.episodeDeleted}" class="alert alert-success"
         data-push-notification data-notification-type="success"
         data-notification-label="회차 삭제">선택한 회차가 삭제되었습니다.</div>
    <div th:if="${contentMessage}" class="alert alert-success"
         data-push-notification data-notification-type="success"
         th:attr="data-notification-label=${contentLabel}"
         th:text="${contentMessage}">완료</div>
    <div th:if="${contentError}" class="alert alert-danger"
         data-push-notification data-notification-type="error"
         th:attr="data-notification-label=${contentErrorLabel}"
         th:text="${contentError}">오류</div>

    <section class="detail-panel">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-4">
            <div class="flex-grow-1">
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <span class="badge status-badge" th:text="${novel.status.displayName}">연재 중</span>
                    <span class="badge"
                          th:classappend="${novel.visibility.name() == 'PUBLIC'} ? ' visibility-public' : ' visibility-private'"
                          th:text="${novel.visibility.displayName}">공개</span>
                    <span th:if="${novel.multiPart and novel.latestCompletedPartLabel() != null}"
                          class="badge part-badge"
                          th:text="${novel.latestCompletedPartLabel()}">1부 완결</span>
                    <span th:each="genreItem : ${novel.genres}"
                          class="badge text-bg-light border"
                          th:text="${genreItem.displayName}">장르</span>
                    <span class="badge text-bg-light border"
                          th:text="|${#lists.size(latestParts)}권|">1권</span>
                    <span class="badge recommend-badge" data-recommend-count
                          th:text="|추천 ${novel.recommendationCount}|">추천 0</span>
                </div>
                <h1 class="display-6 fw-bold" th:text="${novel.title}">작품명</h1>
                <p class="text-secondary mb-0" th:text="|필명 ${novel.penName}|">필명</p>
                <div th:if="${continueBookmark != null}" class="mt-3">
                    <a class="btn btn-dark"
                       th:href="@{/episodes/{id}(id=${continueBookmark.episode.id})}"
                       th:text="|${continueBookmark.episode.episodeNumber}화부터 이어 읽기|">이어 읽기</a>
                </div>
            </div>
            <div class="d-flex flex-column align-items-stretch align-items-lg-end gap-2" data-detail-actions>
                <div th:if="${canFavorite or canRecommend}" class="d-flex flex-wrap gap-2 justify-content-lg-end">
                    <form th:if="${canFavorite}"
                          th:action="@{/novels/{id}/favorite(id=${novel.id}, from=${fromWriter} ? 'writer' : null)}"
                          method="post"
                          data-novel-action="favorite"
                          th:attr="data-novel-id=${novel.id}">
                        <button class="btn favorite-toggle" data-action-button
                                th:classappend="${favorited} ? ' is-active'"
                                type="submit"
                                th:aria-label="${favorited} ? '내 즐겨찾기 해제' : '내 즐겨찾기'"
                                th:text="${favorited} ? '★' : '☆'">☆</button>
                    </form>
                    <form th:if="${canRecommend}"
                          th:action="@{/novels/{id}/recommend(id=${novel.id}, from=${fromWriter} ? 'writer' : null)}"
                          method="post"
                          data-novel-action="recommend"
                          th:attr="data-novel-id=${novel.id}">
                        <button class="btn btn-content-action" data-action-button
                                th:classappend="${recommended} ? 'btn-dark' : 'btn-outline-dark'"
                                type="submit"
                                th:text="${recommended} ? '추천 취소' : '추천하기'">추천하기</button>
                    </form>
                </div>
                <div th:if="${canManageContent}" class="d-flex flex-wrap gap-2 justify-content-lg-end writer-detail-actions">
                    <a class="btn btn-content-action btn-outline-dark"
                       th:href="@{/writer/novels/{id}/edit(id=${novel.id})}">기본 정보 수정</a>
                    <form th:action="@{/writer/novels/{id}/delete(id=${novel.id})}" method="post"
                          data-confirm-delete="작품과 모든 권(부)·회차를 영구 삭제합니다. 삭제 후에는 되돌릴 수 없습니다."
                          data-confirm-title="작품 영구 삭제"
                          data-confirm-text="예, 작품 삭제">
                        <button class="btn btn-content-action btn-outline-danger" type="submit">작품 영구 삭제</button>
                    </form>
                </div>
            </div>
        </div>
        <hr class="my-4">
        <p class="lead detail-synopsis mb-0" th:text="${novel.synopsis}">작품 소개</p>
    </section>

    <section class="mt-5"
             data-parts-root
             th:attr="data-parts-partial=${canManageContent} ? @{/writer/novels/{id}/detail-parts/partial(id=${novel.id})} : null">
        <div th:replace="~{novels/fragments/detail-parts :: partsPanel}"></div>
    </section>
</main>

<footer class="border-top py-4">
    <div class="container small text-secondary">NovelKeep · 이야기를 끝까지, 소장까지</div>
</footer>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/novel-actions.js}"></script>
<script th:if="${canManageContent}" th:src="@{/js/novel-detail-writer.js}"></script>
</body>
</html>
