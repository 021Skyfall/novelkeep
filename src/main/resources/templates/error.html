<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|오류 ${status} · 노벨킵|">오류 · 노벨킵</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <style>
        body { background: #f7f3ee; color: #2b2622; }
        .error-panel {
            max-width: 36rem;
            margin: 4rem auto;
            padding: 2rem;
            border: 1px solid #e3d9ce;
            border-radius: 1rem;
            background: #fffaf4;
            text-align: center;
        }
        .error-code { font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0 1rem; }
        .error-eyebrow { letter-spacing: 0.08em; font-size: 0.8rem; color: #8a8179; }
    </style>
</head>
<body>
<main class="container">
    <section class="error-panel">
        <p class="error-eyebrow mb-0">ERROR</p>
        <h1 class="error-code" th:text="${status != null ? status : 500}">404</h1>
        <p class="text-secondary mb-4"
           th:text="${message != null and !#strings.isEmpty(message)
               ? message
               : '요청하신 페이지를 찾을 수 없습니다. 비공개·삭제되었거나 권한이 없을 수 있습니다.'}">
            요청하신 페이지를 찾을 수 없습니다.
        </p>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a class="btn btn-dark" th:href="@{/main}">홈으로</a>
            <a class="btn btn-outline-secondary" th:href="@{/novels}">작품 탐색</a>
        </div>
    </section>
</main>
</body>
</html>
