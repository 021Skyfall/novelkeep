<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="노벨킵 운영자 대시보드">
    <title>대시보드 | 노벨킵</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/novel.css}">
</head>
<body th:classappend="${roleKey != null} ? | role-${#strings.toLowerCase(roleKey)}|">
<div th:replace="~{fragments/navigation :: siteNav(${navActive})}"></div>

<main class="container py-5">
    <header class="page-heading mb-4 d-flex flex-wrap justify-content-between align-items-end gap-3">
        <div>
            <span class="eyebrow">OPERATOR DASHBOARD</span>
            <h1 class="display-6 fw-bold mt-2 mb-1">대시보드</h1>
            <p class="text-secondary mb-0">작품·펀딩·주문 핵심 수치를 한눈에 확인합니다.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/export.csv}">CSV 다운로드</a>
            <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/export.json}">JSON 다운로드</a>
        </div>
    </header>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="border rounded-3 p-3 h-100">
                <div class="small text-secondary">전체 작품</div>
                <div class="fs-3 fw-bold" th:text="${stats.novelCount()}">0</div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="border rounded-3 p-3 h-100">
                <div class="small text-secondary">공개 회차</div>
                <div class="fs-3 fw-bold" th:text="${stats.publishedEpisodeCount()}">0</div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="border rounded-3 p-3 h-100">
                <div class="small text-secondary">모의 결제 합계</div>
                <div class="fs-4 fw-bold"
                     th:text="${#numbers.formatInteger(stats.paidAmountSum(), 1, 'COMMA') + '원'}">0원</div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="border rounded-3 p-3 h-100">
                <div class="small text-secondary">모의 환불 합계</div>
                <div class="fs-4 fw-bold"
                     th:text="${#numbers.formatInteger(stats.refundedAmountSum(), 1, 'COMMA') + '원'}">0원</div>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="border rounded-3 p-3 h-100">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <strong>펀딩 현황</strong>
                    <span class="badge text-bg-light border"
                          th:text="|성공률 ${stats.successRatePercent()}%|">성공률 0%</span>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <span class="badge text-bg-dark" th:text="|펀딩 중 ${stats.openFundingCount()}|">펀딩 중 0</span>
                    <span class="badge text-bg-success" th:text="|성공 ${stats.successFundingCount()}|">성공 0</span>
                    <span class="badge text-bg-danger" th:text="|실패 ${stats.failedFundingCount()}|">실패 0</span>
                </div>
                <div class="progress mt-3" role="progressbar"
                     th:attr="aria-valuenow=${stats.successRatePercent()}"
                     aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-success"
                         th:style="|width: ${stats.successRatePercent()}%|"></div>
                </div>
                <div class="mt-3 d-flex flex-wrap gap-2">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/fundings}">펀딩 관리</a>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="border rounded-3 p-3 h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <strong>제품 주문별 상태</strong>
                    <span class="badge text-bg-warning text-dark fs-6 px-3 py-2"
                          th:text="|접수 대기 ${stats.pendingOrderCount()}|">접수 대기 0</span>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <span class="badge text-bg-light border fs-6 px-3 py-2"
                          th:each="entry : ${stats.orderCountByStatus()}"
                          th:text="|${entry.key} ${entry.value}|">접수 0</span>
                </div>
                <div class="mt-auto pt-3">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/orders}">주문 관리</a>
                </div>
            </div>
        </div>
    </div>

    <section class="border rounded-3 p-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h5 fw-bold mb-0">최근 주문 묶음</h2>
            <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/orders}">전체 보기</a>
        </div>
        <div th:if="${#lists.isEmpty(stats.recentOrders())}" class="alert alert-light border mb-0">
            주문 데이터가 없습니다. 시드·펀딩 승인 후 확인하세요.
        </div>
        <div th:unless="${#lists.isEmpty(stats.recentOrders())}" class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">묶음번호</th>
                    <th scope="col">작품</th>
                    <th scope="col">권</th>
                    <th scope="col" class="text-end">수량</th>
                    <th scope="col">상태</th>
                    <th scope="col">주문일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${stats.recentOrders()}">
                    <td th:text="${row.campaignId()}">1</td>
                    <td th:text="${row.novelTitle()}">작품</td>
                    <td th:text="${row.partLabel()}">1부</td>
                    <td class="text-end" th:text="${row.totalQuantity()}">1</td>
                    <td><span class="badge text-bg-light border" th:text="${row.statusLabel()}">접수</span></td>
                    <td class="small text-secondary"
                        th:text="${#temporals.format(row.orderedAt(), 'yyyy-MM-dd HH:mm')}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="border-top py-4">
    <div class="container small text-secondary">NovelKeep · 대시보드</div>
</footer>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
