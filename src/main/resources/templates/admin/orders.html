<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="노벨킵 운영자 주문 관리">
    <title>주문 관리 | 노벨킵</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/novel.css}">
    <link rel="stylesheet" th:href="@{/css/confirm-dialog.css}">
</head>
<body th:classappend="${roleKey != null} ? | role-${#strings.toLowerCase(roleKey)}|">
<div th:replace="~{fragments/navigation :: siteNav(${navActive})}"></div>

<main class="container py-5">
    <header class="page-heading mb-4">
        <span class="eyebrow">OPERATOR DASHBOARD</span>
        <h1 class="display-6 fw-bold mt-2">주문 관리</h1>
        <p class="text-secondary mb-0">펀딩 성공 건에서 전환된 책 제작·배송 주문을 확인하고 상태를 관리합니다.</p>
    </header>

    <div th:if="${orderUpdated}" class="alert alert-success"
         data-push-notification data-notification-type="success"
         data-notification-label="주문 상태 변경">주문 상태가 변경되었습니다.</div>
    <div th:if="${orderError}" class="alert alert-danger" th:text="${orderError}">오류</div>

    <div class="search-panel mb-3"
         data-admin-orders-ajax
         data-default-sort-field="ID"
         data-default-sort-dir="DESC"
         th:attr="data-search-url=@{/admin/orders},
                  data-active-sort-field=${criteria.sortField},
                  data-active-sort-dir=${criteria.sortDir}">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label fw-semibold" for="novelTitle">작품명</label>
                <div class="search-input-wrap">
                    <span class="search-input-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
                            <path fill="currentColor"
                                  d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                    </span>
                    <input id="novelTitle" class="form-control search-input-with-icon" type="search"
                           th:value="${criteria.novelTitle}" placeholder="작품 제목" autocomplete="off"
                           data-orders-title>
                </div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold" for="orderedFrom">주문 시작일</label>
                <input id="orderedFrom" class="form-control" type="date"
                       th:value="${criteria.orderedFrom}" data-orders-from>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold" for="orderedTo">주문 종료일</label>
                <input id="orderedTo" class="form-control" type="date"
                       th:value="${criteria.orderedTo}" data-orders-to>
            </div>
        </div>
        <div class="mt-3">
            <span class="form-label fw-semibold d-block mb-2">상태</span>
            <div class="publishing-chip-row" role="group" aria-label="상태">
                <button type="button" class="btn btn-sm publishing-chip"
                        data-orders-status=""
                        th:classappend="${criteria.status == null} ? ' is-active'">전체</button>
                <button type="button" class="btn btn-sm publishing-chip"
                        th:each="statusOption : ${statuses}"
                        th:attr="data-orders-status=${statusOption.name()}"
                        th:text="${statusOption.displayName}"
                        th:classappend="${criteria.status == statusOption} ? ' is-active'">접수</button>
            </div>
        </div>
        <div class="mt-3">
            <span class="form-label fw-semibold d-block mb-2">정렬</span>
            <div class="publishing-chip-row" role="group" aria-label="정렬">
                <button type="button" class="btn btn-sm publishing-chip"
                        th:each="field : ${sortFields}"
                        th:attr="data-sort-field=${field.name()}, data-sort-label=${field.displayName}"
                        th:text="${field.displayName}">번호</button>
            </div>
        </div>
        <div class="mt-3 d-flex flex-wrap gap-2">
            <a class="btn btn-sm btn-outline-dark" data-orders-export-csv
               th:href="@{/admin/orders/export.csv}">CSV 다운로드</a>
            <a class="btn btn-sm btn-outline-dark" data-orders-export-json
               th:href="@{/admin/orders/export.json}">JSON 다운로드</a>
        </div>
        <div class="d-flex justify-content-end mt-3">
            <button type="button" class="btn btn-outline-secondary" data-search-reset>초기화</button>
        </div>
    </div>

    <div data-admin-orders-list>
        <div th:fragment="orderList">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <p class="mb-0 text-secondary small"
                   th:text="|총 ${#lists.size(orders)}건|">총 0건</p>
            </div>

            <div th:if="${#lists.isEmpty(orders)}" class="empty-state border rounded-3 p-5 text-center">
                <strong>조회된 주문이 없습니다.</strong>
                <p class="mb-0 text-secondary">필터 조건을 바꿔 보세요.</p>
            </div>

            <div th:unless="${#lists.isEmpty(orders)}" class="table-responsive border rounded-3">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">주문번호</th>
                        <th scope="col">작품</th>
                        <th scope="col">권</th>
                        <th scope="col" class="text-end">수량</th>
                        <th scope="col">주문일</th>
                        <th scope="col">상태</th>
                        <th scope="col">작품 이동</th>
                        <th scope="col" class="text-end">처리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.id()}">1</td>
                        <td>
                            <a class="fw-semibold link-body-emphasis text-decoration-underline"
                               th:href="@{/fundings/{id}(id=${order.campaignId()})}"
                               th:text="${order.novelTitle()}">작품명</a>
                        </td>
                        <td th:text="${order.partLabel()}">1부</td>
                        <td class="text-end" th:text="${order.quantity()}">1</td>
                        <td th:text="${#temporals.format(order.orderedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                        <td>
                            <span class="badge text-bg-light border" th:text="${order.statusLabel()}">접수</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/novels/{id}(id=${order.novelId()})}">작품 보기</a>
                        </td>
                        <td class="text-end">
                            <form th:if="${order.canAdvance()}"
                                  th:action="@{/admin/orders/{id}/status(id=${order.id()})}" method="post"
                                  class="d-inline"
                                  th:attr="data-confirm-message=|상태를 '${order.nextStatusLabel()}'(으)로 변경할까요?|,
                                           data-confirm-title='주문 상태 변경',
                                           data-confirm-text='예, 변경'">
                                <input type="hidden" name="novelTitle" th:value="${criteria.novelTitle}">
                                <input th:if="${criteria.status != null}" type="hidden" name="status" th:value="${criteria.status}">
                                <input th:if="${criteria.orderedFrom != null}" type="hidden" name="orderedFrom" th:value="${criteria.orderedFrom}">
                                <input th:if="${criteria.orderedTo != null}" type="hidden" name="orderedTo" th:value="${criteria.orderedTo}">
                                <input th:if="${criteria.sortField != null}" type="hidden" name="sortField" th:value="${criteria.sortField}">
                                <input th:if="${criteria.sortDir != null}" type="hidden" name="sortDir" th:value="${criteria.sortDir}">
                                <button class="btn btn-sm btn-outline-dark" type="submit"
                                        th:text="|→ ${order.nextStatusLabel()}|">→ 제작중</button>
                            </form>
                            <span th:unless="${order.canAdvance()}" class="small text-secondary">완료</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer class="border-top py-4">
    <div class="container small text-secondary">NovelKeep · 운영자 주문 관리</div>
</footer>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sort-cycle.js}"></script>
<script th:src="@{/js/admin-orders.js}"></script>
</body>
</html>
