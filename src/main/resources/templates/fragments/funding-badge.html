<th:block xmlns:th="http://www.thymeleaf.org"
          th:fragment="openFundingBadge(campaign)">
    <div th:if="${campaign != null}" class="funding-meter-inline">
        <span class="badge funding-open-badge">펀딩 중</span>
        <span class="funding-meter-pct"
              th:text="|${campaign.achievementPercent()}%|">0%</span>
        <div class="progress progress-funding-sm flex-grow-1" role="progressbar"
             th:attr="aria-valuenow=${campaign.achievementPercent()}"
             aria-valuemin="0" aria-valuemax="100"
             th:aria-label="|펀딩 달성률 ${campaign.achievementPercent()}%|">
            <div class="progress-bar"
                 th:style="|width: ${campaign.achievementPercent()}%|"></div>
        </div>
    </div>
</th:block>

<th:block xmlns:th="http://www.thymeleaf.org"
          th:fragment="openFundingBadgeLabeled(campaign, label)">
    <div th:if="${campaign != null}" class="funding-meter-inline">
        <span class="badge funding-open-badge" th:text="${label}">펀딩 중</span>
        <span class="funding-meter-pct"
              th:text="|${campaign.achievementPercent()}%|">0%</span>
        <div class="progress progress-funding-sm flex-grow-1" role="progressbar"
             th:attr="aria-valuenow=${campaign.achievementPercent()}"
             aria-valuemin="0" aria-valuemax="100"
             th:aria-label="|펀딩 달성률 ${campaign.achievementPercent()}%|">
            <div class="progress-bar"
                 th:style="|width: ${campaign.achievementPercent()}%|"></div>
        </div>
    </div>
</th:block>
