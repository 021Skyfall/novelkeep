<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="siteNav(active)">
    <div class="site-header sticky-top">
    <nav class="navbar navbar-expand-lg bg-white border-bottom nk-navbar" aria-label="공통 메뉴">
        <div class="container py-2">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold"
               th:href="${roleKey == 'ADMIN'} ? @{/admin} : @{/main}">
                <span class="brand-mark" aria-hidden="true">N</span>
                <span>노벨킵</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavbar"
                    aria-controls="siteNavbar" aria-expanded="false" aria-label="메뉴 열기">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="siteNavbar" class="collapse navbar-collapse">
                <ul th:if="${roleKey != 'ADMIN' and active == 'home'}"
                    class="navbar-nav me-auto ms-lg-4 mb-3 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/main}">홈</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/main#popular}">인기작</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/main#new}">신작</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/main#completed}">완결작</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/main#funding}">소장본 펀딩</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2 flex-wrap ms-lg-auto">
                    <button class="btn btn-sm btn-outline-secondary theme-toggle" type="button"
                            data-theme-toggle aria-label="다크 모드로 전환" aria-pressed="false">
                        <span aria-hidden="true">◐</span>
                        <span data-theme-label>다크 모드</span>
                    </button>
                    <span class="badge role-badge rounded-pill"
                          th:text="|${roleName} 체험 중|">체험 중</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-sm btn-outline-secondary" type="submit">역할 변경</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <section class="role-menu border-bottom" th:if="${roleKey != null}">
        <div class="container py-2">
            <div class="role-menu-inner">
                <div th:unless="${roleKey == 'ADMIN'}" class="role-menu-group">
                    <div class="role-links">
                        <a class="role-link" th:classappend="${active == 'novels'} ? ' is-active'"
                           th:href="@{/novels}">작품 탐색</a>
                        <a class="role-link" th:classappend="${active == 'favorites'} ? ' is-active'"
                           th:href="@{/novels(favorite=true)}">내 즐겨찾기</a>
                        <a class="role-link" th:classappend="${active == 'bookmarks'} ? ' is-active'"
                           th:href="@{/bookmarks}">내 책갈피</a>
                        <a class="role-link" th:classappend="${active == 'activities'} ? ' is-active'"
                           th:href="@{/reader/activities}">내 펀딩·주문</a>
                    </div>
                </div>
                <div th:if="${canWrite}" class="role-menu-group">
                    <div class="role-links">
                        <a class="role-link" th:classappend="${active == 'writer'} ? ' is-active'"
                           th:href="@{/writer/novels}">내 작품</a>
                        <a class="role-link" th:classappend="${active == 'publishing'} ? ' is-active'"
                           th:href="@{/writer/publishing}">내 펀딩 관리</a>
                    </div>
                </div>
                <div th:if="${roleKey == 'ADMIN'}" class="role-menu-group">
                    <strong class="role-menu-title">운영자 메뉴</strong>
                    <div class="role-links">
                        <a class="role-link" th:classappend="${active == 'admin-dashboard'} ? ' is-active'"
                           th:href="@{/admin}">대시보드</a>
                        <a class="role-link" th:classappend="${active == 'admin-orders'} ? ' is-active'"
                           th:href="@{/admin/orders}">주문 관리</a>
                        <a class="role-link" th:classappend="${active == 'admin-fundings'} ? ' is-active'"
                           th:href="@{/admin/fundings}">펀딩 관리</a>
                    </div>
                </div>
                <div class="role-menu-actions">
                    <button th:if="${roleKey == 'READER'}"
                            class="btn btn-become-writer"
                            type="button"
                            data-become-writer
                            th:attr="data-logout-url=@{/logout}">
                        작가가 되고 싶으신가요?
                    </button>
                </div>
            </div>
        </div>
    </section>
    </div>

    <div class="floating-actions" aria-label="바로가기">
        <button class="btn btn-dark back-to-top" type="button" data-back-to-top
                aria-label="맨 위로 이동">
            <svg class="floating-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="currentColor"
                      d="M12 5.5 5.8 11.7l1.4 1.4L11 8.3V19h2V8.3l3.8 4.8 1.4-1.4z"/>
            </svg>
        </button>
        <a class="btn btn-dark floating-home"
           th:href="${roleKey == 'ADMIN'} ? @{/admin} : @{/main}"
           aria-label="홈으로 이동">
            <svg class="floating-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="currentColor"
                      d="M12 3.2 3.5 10.5h2.3V20h5.2v-5.2h2V20h5.2v-9.5h2.3L12 3.2z"/>
            </svg>
        </a>
    </div>
    <script th:src="@{/js/notification.js}" defer></script>
    <script th:src="@{/js/confirm-dialog.js}" defer></script>
    <script th:src="@{/js/navigation.js}" defer></script>
</th:block>
</body>
</html>
