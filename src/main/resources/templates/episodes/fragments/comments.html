<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="commentsPanel">
    <div data-comment-alerts>
        <div th:if="${commentSaved}" class="alert alert-success"
             data-push-notification data-notification-type="success"
             data-notification-label="댓글 등록">댓글이 등록되었습니다.</div>
        <div th:if="${commentUpdated}" class="alert alert-success"
             data-push-notification data-notification-type="success"
             data-notification-label="댓글 수정">댓글이 수정되었습니다.</div>
        <div th:if="${commentDeleted}" class="alert alert-success"
             data-push-notification data-notification-type="success"
             data-notification-label="댓글 삭제">댓글이 삭제되었습니다.</div>
        <div th:if="${commentError}" class="alert alert-danger" th:text="${commentError}">오류</div>
    </div>

    <form class="comment-form mb-4" method="post"
          th:action="@{/episodes/{id}/comments(id=${episode.id})}"
          th:object="${commentForm}"
          data-ajax-comment>
        <label class="form-label fw-semibold" for="commentContent">댓글 작성</label>
        <textarea id="commentContent" class="form-control" rows="3" maxlength="1000"
                  th:field="*{content}"
                  placeholder="이 회차에 대한 감상을 남겨 보세요."></textarea>
        <div class="d-flex justify-content-between align-items-center mt-2">
            <span class="small text-secondary">최대 1000자 · 대댓글은 1단까지</span>
            <button class="btn btn-dark btn-sm" type="submit">등록</button>
        </div>
    </form>

    <div data-comment-list>
        <div th:if="${#lists.isEmpty(comments)}" class="empty-state">
            <strong>아직 댓글이 없습니다.</strong>
            <p class="mb-0">첫 댓글을 남겨 보세요.</p>
        </div>

        <ul th:unless="${#lists.isEmpty(comments)}" class="list-unstyled comment-list mb-0">
            <li th:each="comment : ${comments}" class="comment-item"
                th:attr="data-comment-id=${comment.id}">
                <div class="d-flex justify-content-between gap-2 flex-wrap mb-1">
                    <div th:unless="${comment.deleted}">
                        <strong th:text="${comment.member.memberType.displayName}">독자</strong>
                        <span class="small text-secondary ms-2"
                              th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">시간</span>
                        <span th:if="${comment.updatedAt != comment.createdAt}"
                              class="small text-secondary">· 수정됨</span>
                    </div>
                    <div th:if="${comment.deleted}" class="small text-secondary">삭제된 댓글</div>
                    <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-sm btn-outline-secondary" type="button"
                                data-comment-reply-toggle
                                th:attr="data-target=${'comment-reply-' + comment.id}">답글</button>
                        <th:block th:if="${!comment.deleted and comment.member.id == currentMemberId}">
                            <button class="btn btn-sm btn-outline-secondary" type="button"
                                    data-comment-edit-toggle
                                    th:attr="data-target=${'comment-edit-' + comment.id}">수정</button>
                            <form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post"
                                  data-ajax-comment
                                  data-confirm-title="댓글 삭제"
                                  data-confirm-message="이 댓글을 삭제할까요? 답글이 있으면 답글은 유지됩니다.">
                                <button class="btn btn-sm btn-outline-danger" type="submit">삭제</button>
                            </form>
                        </th:block>
                    </div>
                </div>
                <p th:if="${comment.deleted}" class="comment-content comment-deleted mb-0">삭제된 댓글입니다.</p>
                <p th:unless="${comment.deleted}" class="comment-content mb-0" data-comment-view
                   th:text="${comment.content}">댓글</p>
                <form class="comment-edit-form mt-2 d-none" method="post"
                      th:id="|comment-edit-${comment.id}|"
                      th:action="@{/comments/{id}/edit(id=${comment.id})}"
                      th:if="${!comment.deleted and comment.member.id == currentMemberId}"
                      data-ajax-comment>
                    <textarea class="form-control" name="content" rows="3" maxlength="1000"
                              th:text="${comment.content}"></textarea>
                    <div class="d-flex justify-content-end gap-2 mt-2">
                        <button class="btn btn-sm btn-outline-secondary" type="button"
                                data-comment-edit-cancel>취소</button>
                        <button class="btn btn-sm btn-dark" type="submit">저장</button>
                    </div>
                </form>
                <form class="comment-reply-form mt-2 d-none" method="post"
                      th:id="|comment-reply-${comment.id}|"
                      th:action="@{/episodes/{id}/comments(id=${episode.id})}"
                      data-ajax-comment>
                    <input type="hidden" name="parentId" th:value="${comment.id}">
                    <textarea class="form-control" name="content" rows="2" maxlength="1000"
                              placeholder="답글을 입력해 주세요."></textarea>
                    <div class="d-flex justify-content-end gap-2 mt-2">
                        <button class="btn btn-sm btn-outline-secondary" type="button"
                                data-comment-reply-cancel>취소</button>
                        <button class="btn btn-sm btn-dark" type="submit">답글 등록</button>
                    </div>
                </form>

                <ul th:if="${!#lists.isEmpty(comment.replies)}"
                    class="list-unstyled comment-replies mb-0">
                    <li th:each="reply : ${comment.replies}" class="comment-reply"
                        th:unless="${reply.deleted}"
                        th:attr="data-comment-id=${reply.id}">
                        <span class="comment-reply-mark" aria-hidden="true">└</span>
                        <div class="comment-reply-body">
                            <div class="d-flex justify-content-between gap-2 flex-wrap mb-1">
                                <div>
                                    <strong th:text="${reply.member.memberType.displayName}">독자</strong>
                                    <span class="small text-secondary ms-2"
                                          th:text="${#temporals.format(reply.createdAt, 'yyyy-MM-dd HH:mm')}">시간</span>
                                    <span th:if="${reply.updatedAt != reply.createdAt}"
                                          class="small text-secondary">· 수정됨</span>
                                </div>
                                <div class="d-flex gap-2"
                                     th:if="${reply.member.id == currentMemberId}">
                                    <button class="btn btn-sm btn-outline-secondary" type="button"
                                            data-comment-edit-toggle
                                            th:attr="data-target=${'comment-edit-' + reply.id}">수정</button>
                                    <form th:action="@{/comments/{id}/delete(id=${reply.id})}" method="post"
                                          data-ajax-comment
                                          data-confirm-title="답글 삭제"
                                          data-confirm-message="이 답글을 삭제할까요?">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">삭제</button>
                                    </form>
                                </div>
                            </div>
                            <p class="comment-content mb-0" data-comment-view
                               th:text="${reply.content}">답글</p>
                            <form class="comment-edit-form mt-2 d-none" method="post"
                                  th:id="|comment-edit-${reply.id}|"
                                  th:action="@{/comments/{id}/edit(id=${reply.id})}"
                                  th:if="${reply.member.id == currentMemberId}"
                                  data-ajax-comment>
                                <textarea class="form-control" name="content" rows="2" maxlength="1000"
                                          th:text="${reply.content}"></textarea>
                                <div class="d-flex justify-content-end gap-2 mt-2">
                                    <button class="btn btn-sm btn-outline-secondary" type="button"
                                            data-comment-edit-cancel>취소</button>
                                    <button class="btn btn-sm btn-dark" type="submit">저장</button>
                                </div>
                            </form>
                        </div>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</th:block>
</body>
</html>
